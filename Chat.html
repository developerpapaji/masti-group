<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MASTI Chat</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Segoe UI",sans-serif;}

body{
    background:#111b21;
    color:white;
}

/* ===== SPLASH ===== */
.splash{
    position:fixed;
    width:100%;
    height:100%;
    background:#0b141a;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    z-index:999;
}

.warning{
    color:#ff4d4d;
    font-weight:bold;
    margin:15px 0;
}

.btn{
    padding:10px 20px;
    background:#25D366;
    border:none;
    border-radius:20px;
    cursor:pointer;
}

/* ===== APP ===== */
.app{
    display:none;
    height:100vh;
}

/* HEADER */
.header{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px;
    background:#202c33;
}

.menu{
    font-size:20px;
    cursor:pointer;
}

/* SIDEBAR */
.sidebar{
    position:fixed;
    left:-280px;
    top:0;
    width:260px;
    height:100%;
    background:#202c33;
    transition:0.3s;
    z-index:1000;
    overflow-y:auto;
}

.sidebar.active{
    left:0;
}

.user{
    padding:12px;
    display:flex;
    justify-content:space-between;
    cursor:pointer;
}
.user:hover{background:#2a3942;}

.count{color:#25D366;font-size:12px;}

/* OVERLAY */
.overlay{
    position:fixed;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.5);
    display:none;
    z-index:999;
}
.overlay.active{
    display:block;
}

/* MAIN */
.main{
    display:flex;
    flex-direction:column;
    height:100%;
}

/* SEARCH */
.topbar{
    padding:10px;
    background:#0b141a;
}

.topbar input{
    width:100%;
    padding:10px;
    border-radius:8px;
    border:none;
    background:#202c33;
    color:white;
}

/* CHAT */
.chat{
    flex:1;
    overflow-y:auto;
    padding:10px;
    display:flex;
    flex-direction:column;
    gap:6px;
}

.date{
    text-align:center;
    font-size:12px;
    color:#ccc;
}

.msg{
    max-width:75%;
    padding:8px;
    border-radius:8px;
    font-size:14px;
}

.left{background:#202c33;align-self:flex-start;}
.right{background:#005c4b;align-self:flex-end;}

.sender{font-size:12px;color:#25D366;}
.time{font-size:10px;color:#ccc;float:right;}
</style>
</head>

<body>

<!-- SPLASH -->
<div class="splash" id="splash">
    <h1>💬 MASTI TIME</h1>
    <div class="warning">⚠️ MASTI GROUP KO LEKAR CHUD GAYE GURU</div>
    <button class="btn" onclick="startApp()">Enter Chat</button>
</div>

<!-- OVERLAY -->
<div class="overlay" id="overlay" onclick="closeSidebar()"></div>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
    <h3 style="padding:15px;">Users</h3>
    <div id="userList"></div>
</div>

<!-- APP -->
<div class="app" id="app">
    
    <div class="main">

        <div class="header">
            <div class="menu" onclick="openSidebar()">☰</div>
            <div>💬 Chat Viewer</div>
        </div>

        <div class="topbar">
            <input type="text" id="search" placeholder="Search...">
        </div>

        <div class="chat" id="chatBox"></div>

    </div>

</div>

<script>

// ===== START =====
function startApp(){
    document.getElementById("splash").style.display="none";
    document.getElementById("app").style.display="block";
}

// ===== SIDEBAR =====
function openSidebar(){
    document.getElementById("sidebar").classList.add("active");
    document.getElementById("overlay").classList.add("active");
}

function closeSidebar(){
    document.getElementById("sidebar").classList.remove("active");
    document.getElementById("overlay").classList.remove("active");
}

function parseChat(text){
    let lines=text.split("\n");
    let data=[];
    let regex=/^(\d{1,2}\/\d{1,2}\/\d{4}), (.*?) - (.*?): (.*)$/;

    lines.forEach(line=>{
        let m=line.match(regex);
        if(m){
            let [,date,time,sender,msg]=m;
            data.push({date,time,sender,message:msg});
        }
    });
    return data;
}

const CHAT_DATA=parseChat(RAW_CHAT);

// DATE FORMAT
function formatDate(dateStr){
    let [d,m,y]=dateStr.split("/");
    let date=new Date(y,m-1,d);

    let today=new Date();
    let yesterday=new Date();
    yesterday.setDate(today.getDate()-1);

    if(date.toDateString()===today.toDateString()) return "Today";
    if(date.toDateString()===yesterday.toDateString()) return "Yesterday";

    return date.toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"short"});
}

// COUNTS
let counts={};
CHAT_DATA.forEach(m=>{
    counts[m.sender]=(counts[m.sender]||0)+1;
});

// USER LIST
const userList=document.getElementById("userList");
Object.keys(counts).forEach(u=>{
    let div=document.createElement("div");
    div.className="user";
    div.innerHTML=`${u}<span class="count">${counts[u]}</span>`;
    div.onclick=()=>{currentUser=u;applyFilter();closeSidebar();};
    userList.appendChild(div);
});

// RENDER
let currentUser="All";
const chatBox=document.getElementById("chatBox");

function render(data){
    chatBox.innerHTML="";
    let lastDate="",lastSender="";

    data.forEach(msg=>{

        if(msg.date!==lastDate){
            let d=document.createElement("div");
            d.className="date";
            d.innerText=formatDate(msg.date);
            chatBox.appendChild(d);
            lastDate=msg.date;
            lastSender="";
        }

        let div=document.createElement("div");
        let side=msg.sender.includes("Aakash")?"right":"left";

        div.className="msg "+side;

        div.innerHTML=`
            ${msg.sender!==lastSender?`<div class="sender">${msg.sender}</div>`:""}
            ${msg.message}
            <span class="time">${msg.time}</span>
        `;

        chatBox.appendChild(div);
        lastSender=msg.sender;
    });

    chatBox.scrollTop=chatBox.scrollHeight;
}

// FILTER
function applyFilter(){
    let keyword=document.getElementById("search").value.toLowerCase();

    let filtered=CHAT_DATA.filter(m=>{
        return (currentUser==="All"||m.sender===currentUser) &&
               m.message.toLowerCase().includes(keyword);
    });

    render(filtered);
}

document.getElementById("search").oninput=applyFilter;

render(CHAT_DATA);
